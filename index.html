<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rota de Compras</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;
            background: #f4f5f7;
            color: #20242c;
        }

        button,
        input {
            font-family: inherit;
        }

        .app {
            max-width: 700px;
            min-height: 100vh;
            margin: auto;
            background: white;
        }

        /* =====================================================
           CABEÇALHO
        ===================================================== */
        header {
            padding: 26px 20px 18px;
        }

        header h1 {
            font-size: 27px;
            font-weight: 750;
            margin-bottom: 5px;
        }

        header p {
            color: #858b96;
            font-size: 14px;
        }

        /* =====================================================
           RESUMO
        ===================================================== */
        .resumo {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 0 18px 18px;
        }

        .resumo-card {
            background: #f5f6f8;
            border-radius: 15px;
            padding: 13px 6px;
            text-align: center;
        }

        .resumo-card strong {
            display: block;
            font-size: 20px;
            margin-bottom: 2px;
        }

        .resumo-card span {
            color: #858b96;
            font-size: 11px;
        }

        /* =====================================================
           CONTEÚDO
        ===================================================== */
        main {
            padding: 0 18px 100px;
        }

        .titulo-secao {
            font-size: 18px;
            font-weight: 700;
            margin: 12px 0;
        }

        /* =====================================================
           BUSCA
        ===================================================== */
        .busca-wrapper {
            position: relative;
            margin-bottom: 14px;
        }

        .busca {
            width: 100%;
            height: 46px;
            border: 1px solid #e1e3e7;
            background: #f7f8f9;
            border-radius: 13px;
            padding: 0 15px 0 42px;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }

        .busca:focus {
            background: white;
            border-color: #bfc3ca;
            box-shadow: 0 0 0 3px rgba(23, 26, 32, 0.06);
        }

        .busca-icone {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 17px;
            pointer-events: none;
        }

        /* =====================================================
           CATEGORIAS
        ===================================================== */
        .categorias-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 15px;
        }

        .seta-categoria {
            flex-shrink: 0;
            width: 34px;
            height: 38px;
            border: none;
            border-radius: 10px;
            background: #f0f1f3;
            color: #333;
            font-size: 24px;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .seta-categoria:hover {
            background: #e3e4e7;
        }

        .categorias {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow-x: auto;
            scroll-behavior: smooth;
            flex: 1;
            scrollbar-width: none;
            padding: 2px 0;
        }

        .categorias::-webkit-scrollbar {
            display: none;
        }

        .categoria-btn {
            flex-shrink: 0;
            border: none;
            background: #f1f2f4;
            border-radius: 12px;
            padding: 10px 14px;
            cursor: pointer;
            font-size: 13px;
            color: #626873;
            white-space: nowrap;
            transition: 0.2s;
        }

        .categoria-btn.ativa {
            background: #171a20;
            color: white;
        }

        /* =====================================================
           CONTADOR DA CATEGORIA
        ===================================================== */
        .categoria-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 2px 2px 10px;
        }

        .categoria-info strong {
            font-size: 13px;
        }

        .categoria-info span {
            color: #9297a0;
            font-size: 11px;
        }

        /* =====================================================
           PRODUTOS
        ===================================================== */
        .produtos-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 32px;
        }

        .produto-card {
            min-width: 0;
            border: 1px solid #e6e7ea;
            background: white;
            border-radius: 13px;
            padding: 10px 9px;
            transition: 0.15s;
        }

        .produto-card.ativo {
            background: #f1f2f4;
            border-color: #bfc3ca;
        }

        .produto-icone {
            width: 52px;
            height: 52px;
            margin-bottom: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .produto-icone img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .produto-nome {
            font-size: 12px;
            font-weight: 650;
            line-height: 1.25;
            min-height: 30px;
            display: flex;
            align-items: flex-start;
        }

        /* =====================================================
           CONTROLE DO PRODUTO
        ===================================================== */
        .produto-controle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #eef0f2;
            border-radius: 9px;
            overflow: hidden;
            margin-top: 8px;
        }

        .produto-controle button {
            width: 28px;
            height: 28px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 17px;
            color: #20242c;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .produto-controle button:hover {
            background: #e1e3e6;
        }

        .quantidade {
            min-width: 22px;
            text-align: center;
            font-size: 12px;
            font-weight: 700;
        }

        /* =====================================================
           RESULTADO DA BUSCA
        ===================================================== */
        .busca-resultado {
            color: #858b96;
            font-size: 12px;
            margin: -5px 2px 10px;
        }

        .sem-resultados {
            grid-column: 1 / -1;
            text-align: center;
            padding: 30px 15px;
            background: #f7f7f8;
            border-radius: 15px;
            color: #999;
            font-size: 13px;
        }

        /* =====================================================
           ROTA
        ===================================================== */
        .rota-container {
            margin-top: 10px;
        }

        .rota-vazia {
            text-align: center;
            padding: 30px 15px;
            background: #f7f7f8;
            border-radius: 16px;
            color: #999;
            font-size: 14px;
        }

        .entrada,
        .caixa {
            text-align: center;
            padding: 15px;
            border-radius: 14px;
            font-weight: 700;
        }

        .entrada {
            background: #f1f2f4;
            margin-bottom: 10px;
        }

        .caixa {
            background: #171a20;
            color: white;
            margin-top: 10px;
        }

        /* =====================================================
           CORREDOR
        ===================================================== */
        .corredor {
            background: #f7f7f8;
            border: 1px solid #e7e8eb;
            border-radius: 16px;
            padding: 16px;
            margin: 10px 0;
            position: relative;
            transition: 0.2s;
        }

        .corredor.percorrido {
            background: #eef0f1;
            border-color: #d5d7db;
            opacity: 0.65;
        }

        .corredor-topo {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 10px;
        }

        .corredor-titulo {
            font-weight: 700;
        }

        .corredor-check {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            color: #777;
            font-size: 12px;
            white-space: nowrap;
        }

        .corredor-check input {
            width: 19px;
            height: 19px;
            accent-color: #171a20;
            cursor: pointer;
        }

        .corredor.percorrido .corredor-titulo {
            text-decoration: line-through;
            color: #8c9098;
        }

        .corredor:not(:last-of-type)::after {
            content: "↓";
            position: absolute;
            left: 50%;
            bottom: -23px;
            color: #aaa;
            font-size: 18px;
            z-index: 2;
        }

        /* =====================================================
        PRODUTOS NA ROTA
        ===================================================== */
        .rota-produto {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 0;
            color: #666;
            font-size: 13px;
        }

        .rota-produto-check {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            accent-color: #171a20;
            cursor: pointer;
        }

        .rota-produto-info {
            display: flex;
            align-items: center;
            gap: 7px;
            flex: 1;
            min-width: 0;
        }

        .rota-produto-nome {
            flex: 1;
        }

        .rota-produto.quantidade-finalizada
        .rota-produto-nome {
            text-decoration: line-through;
            color: #aaa;
        }

        .rota-produto.quantidade-finalizada {
            opacity: 0.7;
        }

        .rota-progresso {
            color: #858b96;
            font-size: 11px;
            font-weight: 500;
            white-space: nowrap;
        }

        .rota-produto-icone {
            width: 28px;
            height: 28px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .rota-produto-icone img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* =====================================================
           RESPONSIVO
        ===================================================== */
        @media (max-width: 560px) {
            .produtos-grid {grid-template-columns: repeat(3, 1fr);}
        }

        @media (max-width: 390px) {
            .produtos-grid {grid-template-columns: repeat(2, 1fr);}
            .produto-card {padding: 10px;}
            .produto-nome {font-size: 12px;}
        }
    </style>
</head>

                    🛒

                    Selecione os produtos para montar sua rota.
                </div>
            </div>
        </div>
    </main>
</div>

        "Pet Shop": [

            {nome:"Ração para gato",icone:"icons/racao.png",corredor:18},
            {nome:"Petisco para cachorro",icone:"icons/racao.png",corredor:18},
            {nome:"Petisco para gato",icone:"icons/racao.png",corredor:18},
            {nome:"Areia para gato",icone:"icons/areia.png",corredor:18},
            {nome:"Coleira",icone:"icons/coleira.png",corredor:18},
            {nome:"Guia",icone:"icons/guia.png",corredor:18},

            {nome:"Casinha",icone:"icons/casinha.png",corredor:18}
        ]

    // =========================================================
    // ESTADO
    // =========================================================
    let compras = {};
    let categoriaAtual = Object.keys(categorias)[0];
    let corredoresPercorridos = new Set();
    let produtosPegos = new Set();

    // =========================================================
    // MARCAR PRODUTO COMO PEGO
    // =========================================================
    function alternarProdutoPego(nome) {
        if (produtosPegos.has(nome)) {
            produtosPegos.delete(nome);
        } else {
            produtosPegos.add(nome);
        }
        atualizarRota();
    }

    // =========================================================
    // CATEGORIAS
    // =========================================================
    function criarCategorias() {
        const container = document.getElementById("categorias");
        container.innerHTML = "";

        Object.keys(categorias).forEach(categoria => {
            const button = document.createElement("button");
            button.className = "categoria-btn";

            if (categoria === categoriaAtual) {
                button.classList.add("ativa");
            }

            button.textContent = categoria;
            button.onclick = () => {
                categoriaAtual = categoria;
                document.getElementById("busca").value = "";
                criarCategorias();
                mostrarProdutos();
            };
            container.appendChild(button);
        });
    }

    // =========================================================
    // SETAS DAS CATEGORIAS
    // =========================================================
    function moverCategorias(direcao) {
        const container = document.getElementById("categorias");
        const distancia =Math.max(160, container.clientWidth * 0.75);
        container.scrollBy({left: direcao * distancia, behavior: "smooth"});
    }

    // =========================================================
    // NORMALIZAR TEXTO
    // Permite buscar sem se preocupar com acentos.
    // =========================================================
    function normalizarTexto(texto) {
        return texto.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
    }

    // =========================================================
    // MOSTRAR PRODUTOS
    // =========================================================
    function mostrarProdutos() {
        const container =document.getElementById("produtos");
        const busca =normalizarTexto(document.getElementById("busca").value.trim());

        container.innerHTML = "";
        let produtosExibidos = [];

        // -----------------------------------------------------
        // BUSCA GLOBAL
        // -----------------------------------------------------
        if (busca) {
            Object.entries(categorias).forEach(([categoria, produtos]) => {
                    produtos.forEach(produto => {
                        if (normalizarTexto(produto.nome).includes(busca)) {
                            produtosExibidos.push({...produto, categoria});
                        }
                    });
                }
            );
            document.getElementById("categoriaNome").textContent = "Resultados da busca";
            document.getElementById("categoriaQuantidade").textContent = `${produtosExibidos.length} produto(s)`;
        }

        // -----------------------------------------------------
        // CATEGORIA ATUAL
        // -----------------------------------------------------
        else {
            produtosExibidos = categorias[categoriaAtual];
            document.getElementById("categoriaNome").textContent = categoriaAtual;
            document.getElementById("categoriaQuantidade").textContent = `${produtosExibidos.length} produtos`;
        }

        // -----------------------------------------------------
        // NENHUM RESULTADO
        // -----------------------------------------------------
        if (produtosExibidos.length === 0) {
            container.innerHTML = `
                <div class="sem-resultados">
                    🔎<br><br>
                    Nenhum produto encontrado.
                </div>
            `;
            return;
        }

        // -----------------------------------------------------
        // CRIAR CARDS
        // -----------------------------------------------------
        produtosExibidos.forEach(produto => {
            const quantidade = compras[produto.nome] || 0;
            const card = document.createElement("div");
            card.className = "produto-card";

            if (quantidade > 0) {
                card.classList.add("ativo");
            }

            card.innerHTML = `
                <div class="produto-icone">
                    <img
                        src="${produto.icone}"
                        alt="${produto.nome}"
                        loading="lazy"
                    >
                </div>

                <div class="produto-nome">
                    ${produto.nome}
                </div>

                <div class="produto-controle">

                    <button
                        type="button"
                        aria-label="Diminuir ${produto.nome}"
                        onclick="alterarQuantidade('${produto.nome}', -1)"
                    >
                        −
                    </button>

                    <div class="quantidade">
                        ${quantidade}
                    </div>

                    <button
                        type="button"
                        aria-label="Adicionar ${produto.nome}"
                        onclick="alterarQuantidade('${produto.nome}', 1)"
                    >
                        +
                    </button>

                </div>
            `;
            container.appendChild(card);
        });
    }

    // =========================================================
    // ALTERAR QUANTIDADE
    // =========================================================
    function alterarQuantidade(nome, valor) {
        const quantidadeAtual = compras[nome] || 0;
        const novaQuantidade = Math.max(0, quantidadeAtual + valor);

        if (novaQuantidade === 0) {
            delete compras[nome];

        } else {
            compras[nome] = novaQuantidade;

        }
        // Se voltar a adicionar algo de um corredor já percorrido, o corredor volta para a rota
        const produto = encontrarProduto(nome);

        if (produto && novaQuantidade > 0) {
            corredoresPercorridos.delete(produto.corredor);
        }

        atualizar();
    }

    // =========================================================
    // ENCONTRAR PRODUTO
    // =========================================================
    function encontrarProduto(nome) {
        for (const categoria of Object.values(categorias)) {
            const produto = categoria.find(item => item.nome === nome);

            if (produto) {
                return produto;
            }
        }
        return null;
    }

    // =========================================================
    // MARCAR CORREDOR
    // =========================================================
    function alternarCorredor(corredor) {
        if (corredoresPercorridos.has(corredor)) {
            corredoresPercorridos.delete(corredor);

        } else {
            corredoresPercorridos.add(corredor);
        }

        atualizarRota();
        atualizarResumo();
    }

    // =========================================================
    // ATUALIZAR
    // =========================================================
    function atualizar() {
        atualizarResumo();
        mostrarProdutos();
        atualizarRota();

    }

    // =========================================================
    // RESUMO
    // =========================================================
    function atualizarResumo() {

        const produtos = Object.entries(compras);
        const totalItens =produtos.reduce((total, [, quantidade]) => total + quantidade, 0);
        const corredores = new Set();

        produtos.forEach(([nome]) => {
                const produto =encontrarProduto(nome);

                if (produto) {
                    corredores.add(produto.corredor);
                }
            }
        );
        document.getElementById("totalItens").textContent = totalItens;
        document.getElementById("totalCorredores").textContent = corredores.size;
        document.getElementById("corredoresPercorridos").textContent = [...corredoresPercorridos].filter(corredor => corredores.has(corredor)).length;
    }

    // =========================================================
    // ROTA
    // =========================================================
    function atualizarRota() {
        const container = document.getElementById("rota");
        const produtosSelecionados = Object.entries(compras);

        if (produtosSelecionados.length === 0) {

            container.innerHTML = `
                <div class="rota-vazia">
                    🛒
                    <br><br>
                    Selecione os produtos para montar sua rota.
                </div>
            `;
            return;
        }

        // -----------------------------------------------------
        // AGRUPAR PRODUTOS POR CORREDOR
        // -----------------------------------------------------
        const mapa = {};
        produtosSelecionados.forEach(([nome, quantidade]) => {
                const produto = encontrarProduto(nome);

                if (!produto) {
                    return;
                }

                if (!mapa[produto.corredor]) {
                    mapa[produto.corredor] = [];
                }

                mapa[produto.corredor].push({...produto, quantidade});
            }
        );

        // -----------------------------------------------------
        // ORDENAR CORREDORES
        // -----------------------------------------------------
        const corredores = Object.keys(mapa).map(Number).sort((a, b) => a - b);

        let html = `
            <div class="entrada">
                🛒 Entrada
            </div>
        `;

        // -----------------------------------------------------
        // CRIAR CORREDORES
        // -----------------------------------------------------
        corredores.forEach(corredor => {
            const percorrido = corredoresPercorridos.has(corredor);
            const produtosDoCorredor = mapa[corredor];
            const totalProdutos = produtosDoCorredor.length;
            const produtosPegosNoCorredor = produtosDoCorredor.filter(produto => produtosPegos.has(produto.nome)).length;

            html += `
                <div
                    class="
                        corredor
                        ${percorrido ? "percorrido" : ""}
                    "
                >
                    <div class="corredor-topo">
                        <div class="corredor-titulo">
                            📍 Corredor ${corredor}
                        </div>
                        
                        <label class="corredor-check">
                            <input
                                type="checkbox"
                                ${percorrido ? "checked" : ""}
                                onchange="
                                    alternarCorredor(
                                        ${corredor}
                                    )
                                "
                            >
                            Já passei
                        </label>
                    </div>

                    <div class="rota-progresso">
                        ${produtosPegosNoCorredor}
                        de
                        ${totalProdutos}
                        produtos pegos
                    </div>
            `;

            // -------------------------------------------------
            // PRODUTOS
            // -------------------------------------------------
            produtosDoCorredor.forEach(produto => {
                const pego = produtosPegos.has(produto.nome);
                html += `
                    <label
                        class="
                            rota-produto
                            ${pego
                                ? "quantidade-finalizada"
                                : ""}
                        "
                    >
                        <input
                            class="rota-produto-check"
                            type="checkbox"
                            ${pego ? "checked" : ""}
                            onchange="
                                alternarProdutoPego(
                                    '${produto.nome}'
                                )
                            "
                        >
                        <span class="rota-produto-info">
                            <span class="rota-produto-icone">
                                <img
                                    src="${produto.icone}"
                                    alt=""
                                    loading="lazy"
                                >
                            </span>
                            <span class="rota-produto-nome">
                                ${produto.nome}
                                ×
                                ${produto.quantidade}
                            </span>
                        </span>
                    </label>
                `;
            });

            html += `
                </div>
            `;
        });

        html += `
            <div class="caixa">
                🏁 Caixa
            </div>
        `;
        container.innerHTML = html;
    }

    // =========================================================
    // BUSCA EM TEMPO REAL
    // =========================================================
    document.getElementById("busca").addEventListener("input",mostrarProdutos);

    // =========================================================
    // INICIALIZAÇÃO
    // =========================================================
    criarCategorias();
    mostrarProdutos();
    atualizar();

</script>
